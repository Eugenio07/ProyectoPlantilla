# Los pasos de calidad, en UNA acción compuesta: si otro workflow los repite, dos copias derivan.
name: calidad
description: spotless, detekt y los verificadores que no necesitan nada externo
inputs:
  sin_gradle:
    description: "true en un PR de solo documentación: corre los guiones, no Gradle"
    default: "false"
runs:
  using: composite
  steps:
    - name: Formato (spotless + ktlint)
      if: inputs.sin_gradle != 'true'
      shell: bash
      run: ./gradlew spotlessCheck --console=plain
    - name: detekt (por source set)
      if: inputs.sin_gradle != 'true'
      shell: bash
      run: >-
        ./gradlew --console=plain --no-build-cache :androidApp:detekt
        :shared:detektAndroidMainSourceSet :shared:detektAndroidHostTestSourceSet
        :shared:detektCommonMainSourceSet :shared:detektCommonTestSourceSet
        :shared:detektIosMainSourceSet :shared:detektIosTestSourceSet
    - name: Entregables del arranque
      shell: bash
      run: python3 -I config/checks/entregables.py
    - name: Pruebas del recuento de tests (#PP15)
      shell: bash
      run: bash config/checks/recuento_tests_test.sh
    - name: Sin números de versión en los documentos vivos (#PP16)
      shell: bash
      run: python3 -I config/checks/versiones.py && bash config/checks/versiones_test.sh
    - name: La cola (necesita el historial completo; con uno superficial sale 3)
      shell: bash
      run: python3 -I config/checks/cola.py
    - name: Tope de los planes
      shell: bash
      run: python3 -I config/checks/tope_plan.py
    # Los mismos verificadores que la puerta (un criterio, dos disparadores), salvo skills_de_cierre.py, que necesita
    # ~/.claude y solo corre en local (auditoría 2026-11-11, P1-6).
    - name: wiki/ y sus punteros
      shell: bash
      run: python3 -I config/checks/wiki.py
    - name: Una sola fuente de reglas
      shell: bash
      run: python3 -I config/checks/sin_para_claude_md.py
    - name: CLAUDE.md (proporción por regla)
      shell: bash
      run: python3 -I config/checks/claude_md.py
    - name: Validación en tres pasos declarada y al día (#PP7)
      shell: bash
      run: bash config/checks/validaciones_test.sh && python3 -I config/checks/validaciones.py
    - name: Hooks de Claude Code (sin los casos que corren Gradle)
      shell: bash
      run: bash config/checks/hooks_test.sh
    - name: El renombrado de la plantilla (config/derivar.sh)
      shell: bash
      run: bash config/checks/derivar_test.sh
